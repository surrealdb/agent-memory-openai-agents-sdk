[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectron-openai-agents"
version = "0.1.0"
description = "Spectron agent memory for the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SurrealDB", email = "hello@surrealdb.com" }]
keywords = [
    "surrealdb",
    "spectron",
    "openai",
    "agents",
    "memory",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai-agents>=0.0.1",
    "surrealdb[spectron]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://surrealdb.com/platform/spectron"
Documentation = "https://surrealdb.com/docs/learn/spectron"
Repository = "https://github.com/surrealdb-dev/spectron-openai-agents-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/spectron_openai_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
